name: Check
on:
  push:
  pull_request:
  # The startup catalog has a time limit, which can pass without any new commits.
  schedule:
    - cron: '41 6 * * 1'
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm audit --audit-level=high
